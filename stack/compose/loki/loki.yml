# Loki: stores the logs that Alloy collects. Single process, files on local disk.
auth_enabled: false          # single user; Loki is only reachable inside the Docker network

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2025-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h     # keep logs for 7 days
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_query_series: 1000

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 32      # small cache: this server only has 1 GB of RAM

pattern_ingester:
  enabled: false

analytics:
  reporting_enabled: false   # don't send usage statistics to Grafana Labs
