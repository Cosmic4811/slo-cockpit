# SLO Cockpit: the whole observability stack on one small (1 GB RAM) server.
# The same file runs on the EC2 server (deployed by Ansible) and on your laptop (Docker Desktop).
#
# Security defaults for every container (the "x-defaults" block):
#   no Linux capabilities, no privilege escalation, read-only filesystem,
#   memory and process limits (one container cannot starve the others),
#   UIs published on 127.0.0.1 only: on AWS they are reachable solely through the SSM tunnel.
name: slo-cockpit

x-defaults: &defaults
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 200
  networks: [obs]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      labels: com.docker.compose.service   # adds the service name to every log line (read by Alloy)

services:
  # ---------------------------------------------------------------- the demo service
  shop-api:
    <<: *defaults
    build: ../demo-app
    image: slo-cockpit/shop-api:local
    environment:
      ADMIN_TOKEN_FILE: /run/secrets/shop_api_admin_token
    secrets: [shop_api_admin_token]
    ports: ["127.0.0.1:8080:8080"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  loadgen:
    <<: *defaults
    image: slo-cockpit/shop-api:local   # same image as shop-api, different program
    pull_policy: never
    command: ["python", "loadgen.py"]
    environment:
      TARGET_URL: http://shop-api:8080
      LOADGEN_RPS: "4"
    depends_on:
      shop-api:
        condition: service_healthy
    mem_limit: 64m

  # ---------------------------------------------------------------- metrics + alerting
  prometheus:
    <<: *defaults
    image: quay.io/prometheus/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=31d
      - --storage.tsdb.retention.size=3GB
      - --web.external-url=http://localhost:9090/
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 320m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  alertmanager:
    <<: *defaults
    image: quay.io/prometheus/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/${ALERTMANAGER_CONFIG_FILE:-alertmanager.yml}
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093/
      - --cluster.listen-address=   # single server: turn off the clustering port
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    networks:
      obs:
        # Fixed address: the server firewall lets ONLY this IP reach the EC2 metadata
        # service (for SNS credentials). Keep in sync with stack/ansible/site.yml.
        ipv4_address: 10.200.0.10
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  blackbox:
    <<: *defaults
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    user: "65534:65534"   # the image defaults to root; "nobody" is enough
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox:/etc/blackbox:ro
    mem_limit: 48m

  node-exporter:
    <<: *defaults
    image: quay.io/prometheus/node-exporter:v1.12.1
    command: ["--path.rootfs=/host", "--path.udev.data=/host/run/udev/data"]
    pid: host
    volumes:
      - /:/host:ro
    mem_limit: 48m

  # ---------------------------------------------------------------- logs
  loki:
    <<: *defaults
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki:/etc/loki:ro
      - loki-data:/loki
    mem_limit: 256m

  alloy:
    <<: *defaults
    image: grafana/alloy:v1.20.0
    user: "0:0"   # Docker's log files belong to root; read-only mount + no capabilities limits the risk
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/alloy-data   # a root-owned volume (the image's own data folder belongs to another user)
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy:/etc/alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy-data:/alloy-data
    depends_on: [loki]
    mem_limit: 192m

  # ---------------------------------------------------------------- dashboards
  grafana:
    <<: *defaults
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"   # no plugin downloads at start-up
      # Grafana starts a ~25 MB helper process per built-in data source. We only use
      # Prometheus, Loki and Alertmanager, so switch the rest off (saves ~250 MB of RAM).
      GF_PLUGINS_DISABLE_PLUGINS: "elasticsearch,influxdb,mssql,mysql,grafana-postgresql-datasource,grafana-pyroscope-datasource,jaeger,zipkin,tempo,opentsdb,stackdriver"
      GF_SERVER_ROOT_URL: http://localhost:3000/
      GF_LOG_LEVEL: warn
      GOMEMLIMIT: 220MiB   # makes Go's garbage collector work harder before the 320m hard limit
    secrets: [grafana_admin_password]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    tmpfs: ["/tmp:size=64m"]   # Grafana's plugins need a small writable /tmp (kept in RAM)
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, loki, alertmanager]
    mem_limit: 320m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  obs:
    ipam:
      config:
        - subnet: 10.200.0.0/24

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  grafana-data:

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  shop_api_admin_token:
    file: ./secrets/shop_api_admin_token
