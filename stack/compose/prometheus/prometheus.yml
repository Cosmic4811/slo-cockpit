# Prometheus: pulls ("scrapes") metrics from every service every 15 seconds.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The demo service (white-box: the app reports on itself)
  - job_name: shop-api
    static_configs:
      - targets: ["shop-api:8080"]
        labels:
          service: shop-api

  # Black-box: blackbox_exporter calls the API from the outside, like a user would
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://shop-api:8080/api/items"]
        labels:
          service: shop-api
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # The server itself (CPU, memory, swap, disk)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # The monitoring stack monitors itself too
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox:9115"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
    # Cardinality control: Loki exposes thousands of histogram series we never
    # chart. Dropping them at scrape time keeps Prometheus small on a 1 GB server.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "loki_.+_bucket|cortex_.+_bucket|go_gc_.+|go_sched_.+"
        action: drop
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: ".+_bucket|go_gc_.+|go_sched_.+"
        action: drop
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: ".+_bucket|go_gc_.+|go_sched_.+"
        action: drop
